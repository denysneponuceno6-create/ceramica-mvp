# =====================================================================
# Blueprint do Render (opcional).
# Permite criar o servico web + banco de uma vez em Blueprints > New.
# Tambem e possivel criar tudo manualmente pelo painel: veja o README.
# =====================================================================
services:
  - type: web
    name: ceramica-mvp
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Gerado automaticamente pelo Render e nunca exposto no repositorio.
      - key: SESSION_SECRET
        generateValue: true

      # Conexao injetada a partir do banco declarado abaixo.
      - key: DATABASE_URL
        fromDatabase:
          name: ceramica-db
          property: connectionString

      - key: DATABASE_SSL
        value: true

      - key: TRUST_PROXY
        value: true

      # Cria o schema e a carga de demonstracao no primeiro boot.
      - key: AUTO_MIGRATE
        value: true
      - key: AUTO_SEED
        value: true

      - key: ADMIN_EMAIL
        value: admin@ceramica.local

      # sync: false = o valor e digitado por voce no painel do Render.
      # Se deixar em branco, uma senha aleatoria aparece nos logs do deploy.
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ceramica-db
    plan: free
    databaseName: ceramica
    user: ceramica
